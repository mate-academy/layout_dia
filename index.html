<!doctype html>
<html
  lang="en"
  class="body"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dia</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="page__body">
    <div class="header">
      <div class="top-bar">
        <div class="top-bar__icons">
          <a
            href="#"
            class="top-bar__logo"
          >
            <img
              src="/src/images/logo/air-logo.svg"
              alt="Logo"
            />
          </a>

          <button
            href="#menu"
            type="button"
            class="menu-btn top-bar__menu"
            id="menu-open"
          >
            <img
              src="/src/images/logo/menu-logo.svg"
              alt="menu open"
            />
          </button>
        </div>

        <a
          href="#contact"
          class="top-bar__contact"
        >
          HIRE US
        </a>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">Strategic Agency</h1>

        <p class="header__subtitle">
          We believe in the power of bold ideas that can solve business
          challenges.
        </p>

        <button
          href="#contact"
          class="header__button"
        >
          Learn More
        </button>
      </div>

      <!-- // menu -->
      <aside
        class="menu page__menu"
        id="menu"
      >
        <div class="menu__content">
          <div class="top-bar menu__top">
            <a
              href="#"
              class="menu__top__logo-link"
            >
              <img
                src="/src/images/logo/air-logo.svg"
                alt="Logo"
              />
            </a>

            <button
              href="#"
              type="button"
              class="menu-btn"
              id="menu-close"
            >
              <img
                src="/src/images/logo/menu-logo.svg"
                alt="menu"
              />
            </button>
          </div>

          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#about-us"
                  class="nav__link"
                >
                  About Us
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#services"
                  class="nav__link"
                >
                  Services
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#testimonials"
                  class="nav__link"
                >
                  Testimonials
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#contact"
                  class="nav__link"
                >
                  Contact us
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <div class="header__intro"></div>
    </div>
    <script src="src/scripts/menu.js" defer></script>
  </body>
</html>
