<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Air</title>
    <link
      rel="icon"
      href="/src/images/logo/favicon.svg"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-top">
        <div class="header-top__logo-box">
          <a
            href="#"
            class="header-top__logo-box__logo"
          >
            <img
              src="/src/images/logo/favicon.svg"
              alt="Air logo"
              class="header-top__logo-box__logo__image"
            />
          </a>
          <a
            href="#"
            class="header-top__logo-box__burger"
          >
            <img
              src="/src/images/burger-menu.svg"
              alt="Air logo"
              class="header-top__logo-box__burger__image"
            />
          </a>
        </div>

        <div class="header-top__hire-block">
          <p class="header-top__hire-block__text">HIRE US</p>
          <img
            src="/src/images/hire-us-stripe.svg"
            alt="Blue stripe"
            class="header-top__hire-block__stripe"
          />
        </div>
      </div>

      <div class="header-bottom">
        <div class="header-bottom__title-box">
          <h1 class="header-bottom__title-box__title">Strategic Agency</h1>
          <p class="header-bottom__title-box__text">
            We believe in the power of bold ideas that can solve business
            challenges.
          </p>
        </div>

        <a
          href="#"
          class="header-bottom__button"
        >
          Learn more
        </a>
      </div>
    </header>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
