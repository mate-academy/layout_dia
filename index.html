<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dia</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body class="page">
    <header class="header">
      <div class="header__content">
        <div class="header__top">
          <div class="header__top__logos">
            <div class="header__top__logo"></div>
            <div class="header__top__menu"></div>
          </div>

          <div class="header__top__title">
            <a class="hire-us-title">hire us</a>
          </div>
        </div>
        <div class="header__title">
          <h1 class="header__title-title">Strategic Agency</h1>
          <div class="header__title-text">
            We believe in the power of bold ideas that can solve business
            challenges.
          </div>
          <button class="header__title-button">Learn more</button>
        </div>
      </div>

      <div class="header__slider">
        <div class="slider">
          <div class="slider__slides">
            <img
              class="slider__slide"
              src="/src/images/slider/slide-img-1.jpg"
              alt="image #1"
            />
            <img
              class="slider__slide"
              src="/src/images/slider/slide-img-2.jpg"
              alt="image #2"
            />
            <img
              class="slider__slide"
              src="/src/images/slider/slide-img-3.jpg"
              alt="image #3"
            />

            <div class="slider__arrows">
              <button
                class="slider__arrows-left"
                onclick="prevSlide()"
              >
                <img
                  class="arrow-left"
                  src="/src/images/slider/Vector-1.svg"
                  alt="left-arrow"
                />
              </button>
              <button
                class="slider__arrows-right"
                onclick="nextSlide()"
              >
                <img
                  class="arrow-right"
                  src="/src/images/slider/Vector.svg"
                  alt="right-arrow"
                />
              </button>
            </div>
            <div class="slider__description"></div>
          </div>
        </div>
      </div>
    </header>

    <script src="src/scripts/main.js"></script>
  </body>
</html>
