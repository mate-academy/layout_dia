<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Dia</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" />
      <link
         href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="main.css" />
   </head>
   <body>
      <header class="header">
         <nav class="header__nav">
            <div class="header__nav-group1">
               <a href="#" class="header__nav-group1--logo">
                  <img src="./images/icons/Air-logo.svg" alt="Air" />
               </a>
               <a href="#" class="header__nav-group1--menu">
                  <img src="./images/icons/menu.svg" alt="Menu" />
               </a>
            </div>

            <div class="header__nav-group2" id="menu-links">
               <a href="#" class="header__nav-link">About us</a>
               <a href="#" class="header__nav-link">Services</a>
               <a href="#" class="header__nav-link">Testimonials</a>
               <a href="#" class="header__nav-link">Contact Us</a>
            </div>

            <a href="#" class="header__nav-info">Hire Us</a>
         </nav>

         <section class="header__content">
            <h1 class="header__content-title">Strategic Agency</h1>
            <p class="header__content-text">
               We believe in the power of bold ideas that can solve business
               challenges.
            </p>

            <button class="header__content-btn">Learn more</button>
         </section>

         <section class="photoslider">
            <div class="photoslider__controls">
               <div class="photoslider__arrows">
                  <button class="photoslider__arrows-btn" onclick="prevImage()">
                     &#10094;
                  </button>
                  <button class="photoslider__arrows-btn" onclick="nextImage()">
                     &#10095;
                  </button>
               </div>
               <div class="photoslider__arrows-texts">
                  <h2 class="photoslider__arrows-title">Intro</h2>
                  <p class="photoslider__arrows-text">
                     By the same illusion which lifts the horizon.
                  </p>
               </div>
            </div>
         </section>
      </header>
   </body>
</html>
