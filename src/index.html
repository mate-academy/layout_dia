<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dia</title>
    <link
      rel="shortcut icon"
      href="./icons/air-logo.svg"
      type="image/x-icon"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__content">
        <div class="top-bar">
          <div class="top-bar__wrapper">
            <a
              href="#"
              class="top-bar__logo-link"
            >
              <img
                src="./icons/air-logo.svg"
                alt="photo-logo"
                class="top-bar__logo"
              />
            </a>
            <a
              href="#"
              class="nav__link nav__link--burger"
            >
              <div class="icon icon--burger-menu">
                <svg
                  width="18"
                  height="8"
                  viewBox="0 0 18 8"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M18 8H0V6H18V8ZM18 2H0V0H18V2Z"
                    fill="white"
                  />
                </svg>
              </div>
            </a>
          </div>
          <nav class="top-bar__nav">
            <ul class="nav__list">
              <li class="list__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  About us
                </a>
              </li>
              <li class="list__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Services
                </a>
              </li>
              <li class="list__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Testimonials
                </a>
              </li>
              <li class="list__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Contact Us
                </a>
              </li>
            </ul>
          </nav>


          <a
            href="#"
            class="nav__link nav__link--hire"
          >
            Hire us
          </a>
        </div>
      </div>
    </header>
    <script src="scripts/main.js"></script>
  </body>
</html>
