<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dia</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <!-- #endregion -->
  <!-- #region header-nav -->
  <body>
    <header class="header">
      <div class="header__inner">
        <div class="header__container">
          <a
            href="#"
            class="header__logo"
          >
            <img
              class="header__logo-image"
              src="./images/logo/dia-logo.png"
              alt="Air logo"
            />
          </a>
          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#about"
                  class="nav__link"
                >
                  About us
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#services"
                  class="nav__link"
                >
                  Services
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#work"
                  class="nav__link"
                >
                  Work
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#contact"
                  class="nav__link"
                >
                  Contact Us
                </a>
              </li>
            </ul>
          </nav>
          <a
            href="#contact"
            class="header__button"
          >
            Hire us
          </a>
        </div>
        <!-- #endregion -->
        <!-- #region header-hero -->
        <div class="hero__content">
          <h1 class="hero__content-text--title">
            Strategic
            <br />
            Agency
          </h1>
          <p class="hero__content-text--subtitle">
            We believe in the power of bold ideas that can solve business
            challenges.
          </p>
          <button class="hero__button">Learn more</button>
          <div class="hero__content-slider">
            <div class="hero__content-slider-bottom">
              <div class="hero__content-slider-bottom-button-arrow">
                <button
                  class="button-arrow"
                  type="button"
                >
                  <img
                    class="arrow"
                    src="./images/slider/arrow-left.png"
                    alt="arrow-left"
                    aria-label="arrow-right"
                  />
                </button>
                <button
                  class="button-arrow"
                  type="button"
                  aria-label="arrow-right"
                >
                  <img
                    class="arrow"
                    src="./images/slider/arrow-right.png"
                    alt="arrow-right"
                  />
                </button>
              </div>
              <div class="hero__content-slider-bottom-description">
                <h3 class="hero__content-slider-bottom-description--title">
                  INTRO
                </h3>
                <p class="hero__content-slider-bottom-description--subtitle">
                  By the same illusion which lifts the horizon.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- #endregion -->
    <main>
      <h2>Dia - це заголовок мейн</h2>
    </main>
    <script src="scripts/main.js"></script>
  </body>
</html>
